<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOTO 4D Update</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    text-align: center;
}

header {
    background: #111;
    color: white;
    padding: 25px 10px;
}

h1 {
    margin: 0;
    font-size: 32px;
}

.container {
    max-width: 600px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    margin: 15px 0;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

.prize {
    font-size: 22px;
    font-weight: bold;
}

.number {
    font-size: 36px;
    font-weight: bold;
    margin: 10px 0;
}

button {
    width: 100%;
    padding: 16px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.update {
    background: #222;
    color: white;
}

.winner {
    background: #ddd;
    color: #111;
}

.contact {
    background: #111;
    color: white;
}

footer {
    margin-top: 30px;
    padding: 20px;
    background: #111;
    color: white;
}
</style>
</head>

<body>

<header>
    <h1>TOTO 4D UPDATE</h1>
    <p>Lucky Number Results</p>
</header>

<div class="container">

    <div class="card">
        <div class="prize">First Prize</div>
        <div class="number">350</div>
        <p>Ringgit</p>
    </div>

    <div class="card">
        <div class="prize">Second Prize</div>
        <div class="number">---</div>
    </div>

    <div class="card">
        <div class="prize">Third Prize</div>
        <div class="number">---</div>
    </div>

    <div class="card">
        <button class="update">TOTO 4D UPDATE</button>
        <button class="winner">WINNER</button>
        <button class="contact">CONTACT</button>
    </div>

</div>

<footer>
    Lucky Number
</footer>

</body>
</html>
